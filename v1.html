<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSCE 考站計時器</title>

<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: one-screen phone tool — station header, huge clock, progress, thumb-zone buttons at bottom */
:root{
  --bg:#101417; --panel:#1a2024; --line:#2b343a; --fg:#eef2f3; --muted:#8e9ba3;
  --go:#2fb57e; --warn:#f2b33d; --over:#ff4b4b; --over-bg:#2a1213;
  --font-ui: "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num: ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  -webkit-tap-highlight-color:transparent;transition:background .4s}
body.over{background:var(--over-bg)}
.app{height:100%;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;
  padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.info{display:grid;grid-template-columns:5.5em 1fr;gap:8px}
.info .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.field input{font:inherit;font-size:17px;font-weight:600;color:var(--fg);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
.field input:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.field input:disabled{opacity:.75}
.clockwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.state{font-size:15px;letter-spacing:.2em;color:var(--muted);font-weight:600}
.clock{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:clamp(84px,26vw,170px);line-height:1;letter-spacing:-.03em;color:var(--fg);transition:color .3s}
.clock.warn{color:var(--warn)}
.clock.over{color:var(--over)}
.bar{width:100%;height:8px;background:var(--panel);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:100%;background:var(--go);transform-origin:left;transition:background .3s}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.scale{width:100%;display:flex;justify-content:space-between;font-family:var(--font-num);font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 2fr;gap:10px}
button{font:inherit;font-weight:700;border-radius:14px;border:0;cursor:pointer;padding:0;min-height:72px;font-size:22px;letter-spacing:.1em}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#main{background:var(--go);color:#06170f}
#main.pause{background:var(--warn);color:#241700}
#reset{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.opts select,.opts .chip{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.opts .chip{min-height:0;font-weight:600;letter-spacing:0}
.confirm{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.confirm button{min-height:44px;font-size:15px;padding:0 16px;letter-spacing:0}
.confirm .yes{background:var(--over);color:#fff}
.confirm .no{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <section class="info" aria-label="考站資訊">
    <div class="field"><label for="st">站別</label><input id="st" value="第3站" maxlength="10"></div>
    <div class="field"><label for="item">考題</label><input id="item" value="腹部身體檢查" maxlength="24"></div>
    <div class="field full"><label for="who">學員代號（請勿輸入真實姓名）</label><input id="who" value="學員A" maxlength="16"></div>
  </section>

  <section class="clockwrap" aria-live="polite">
    <div class="state" id="state">準備開始</div>
    <div class="clock" id="clock" role="timer">08:00</div>
    <div class="bar" aria-hidden="true"><i id="fill"></i><span class="mark" id="mark"></span></div>
    <div class="scale" aria-hidden="true"><span>0:00</span><span id="markLbl">剩 1:00 響鈴</span><span id="totLbl">8:00</span></div>
  </section>

  <div id="confirmBox" class="confirm" hidden>
    <span>確定重設本站計時？</span>
    <button class="yes" id="yes">重設</button><button class="no" id="no">取消</button>
  </div>

  <section class="controls">
    <button id="reset">重設</button>
    <button id="main">開始</button>
  </section>

  <div class="opts">
    <label>每站時間
      <select id="dur">
        <option value="5">5 分鐘</option><option value="6">6 分鐘</option><option value="7">7 分鐘</option>
        <option value="8" selected>8 分鐘</option><option value="10">10 分鐘</option><option value="12">12 分鐘</option>
      </select>
    </label>
    <button class="chip" id="test">試聽鈴聲</button>
  </div>
  <p class="note">剩 1 分鐘響 2 聲提醒，時間到響長鈴並轉紅色，之後顯示超時。<br>計時期間請勿關閉此頁；手機請關閉靜音並調高音量。</p>
</div>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const clock=$('clock'),fill=$('fill'),mainBtn=$('main'),stateEl=$('state'),durSel=$('dur');
  const inputs=[$('st'),$('item'),$('who')];
  let total=8*60*1000, remainAtPause=total, startedAt=0, running=false, raf=0;
  let warned=false, ended=false, wake=null, ctx=null;

  function audio(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
    if(ctx&&ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(freq,start,len,vol=0.5){ const c=audio(); if(!c) return;
    const o=c.createOscillator(),g=c.createGain(); o.type='square'; o.frequency.value=freq;
    const t=c.currentTime+start; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.setValueAtTime(vol,t+len-0.03); g.gain.linearRampToValueAtTime(0,t+len);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+len+0.02); }
  function warnBell(){ tone(880,0,0.25); tone(880,0.4,0.25); vib([200,150,200]); }
  function endBell(){ for(let i=0;i<3;i++){ tone(1046,i*0.6,0.45,0.6); } vib([600,200,600,200,600]); }
  function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p);}catch(e){} }

  async function lockOn(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
  function lockOff(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
  document.addEventListener('visibilitychange',()=>{ if(running&&document.visibilityState==='visible') lockOn(); });

  const remaining=()=> running ? remainAtPause-(Date.now()-startedAt) : remainAtPause;
  function fmt(ms){ const neg=ms<0; const s=Math.floor(Math.abs(ms)/1000+(neg?0:0.999));
    const m=Math.floor(s/60), r=s%60; return (neg?'+':'')+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }

  function render(){
    const ms=remaining();
    clock.textContent=fmt(ms);
    const over=ms<=0, warn=!over&&ms<=60000;
    clock.classList.toggle('over',over); clock.classList.toggle('warn',warn);
    document.body.classList.toggle('over',over);
    fill.style.transform=`scaleX(${Math.max(0,ms)/total})`;
    fill.style.background= over?'var(--over)':warn?'var(--warn)':'var(--go)';
    if(running){
      if(!warned&&ms<=60000&&ms>0){ warned=true; warnBell(); }
      if(!ended&&ms<=0){ ended=true; endBell(); }
      stateEl.textContent= over?'時間到・超時中':warn?'剩最後 1 分鐘':'計時中';
    }
  }
  function loop(){ render(); raf=requestAnimationFrame(loop); }

  function start(){ audio(); running=true; startedAt=Date.now(); lockOn();
    mainBtn.textContent='暫停'; mainBtn.classList.add('pause');
    durSel.disabled=true; inputs.forEach(i=>i.disabled=true); cancelAnimationFrame(raf); loop(); }
  function pause(){ remainAtPause=remaining(); running=false; cancelAnimationFrame(raf); lockOff(); render();
    mainBtn.textContent='繼續'; mainBtn.classList.remove('pause'); stateEl.textContent='已暫停'; }
  function reset(){ running=false; cancelAnimationFrame(raf); lockOff();
    total=Number(durSel.value)*60000; remainAtPause=total; warned=false; ended=false;
    mainBtn.textContent='開始'; mainBtn.classList.remove('pause'); durSel.disabled=false;
    inputs.forEach(i=>i.disabled=false); stateEl.textContent='準備開始';
    $('totLbl').textContent=durSel.value+':00';
    $('mark').style.left=`calc(${60000/total*100}% - 1px)`; render(); }

  mainBtn.onclick=()=> running?pause():start();
  $('reset').onclick=()=>{ if(running||remainAtPause!==total) $('confirmBox').hidden=false; else reset(); };
  $('yes').onclick=()=>{ $('confirmBox').hidden=true; reset(); };
  $('no').onclick=()=>{ $('confirmBox').hidden=true; };
  durSel.onchange=reset;
  $('test').onclick=()=>{ warnBell(); };
  reset();
})();
</script>

</body>
</html>
